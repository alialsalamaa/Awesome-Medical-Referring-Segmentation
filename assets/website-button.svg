    <rect x="8" y="9" width="24" height="20" rx="4" fill="none" stroke="#ffffff" stroke-width="1.7"/>
    <path d="M8 15h24" stroke="#ffffff" stroke-width="1.7"/>
    <circle cx="12" cy="12" r="1.1" fill="#50d5d0"/>
