      <stop offset="0" stop-color="#0b2b43"/>
      <stop offset="0.58" stop-color="#0b5364"/>
      <stop offset="1" stop-color="#087f83"/>
    </linearGradient>
    <linearGradient id="icon-background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#50d5d0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#4e8cff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-12%" y="-40%" width="124%" height="190%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#071a2b" flood-opacity="0.3"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
