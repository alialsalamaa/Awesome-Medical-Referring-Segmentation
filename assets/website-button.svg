<svg xmlns="http://www.w3.org/2000/svg" width="390" height="72" viewBox="0 0 390 72" role="img" aria-labelledby="title description">
  <title id="title">Explore the interactive website</title>
  <desc id="description">Open the searchable medical referring segmentation catalog.</desc>
  <defs>
